<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-mark" src="{{ '/assets/img/logo/fluxs-mark.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="74" height="42">
      <span class="brand-text">
        <span class="brand-name">FLUX<span class="s">S</span></span>
        <span class="brand-sub">{{ site.full_name }}</span>
      </span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle-label"><span></span></label>
    <nav class="site-nav">
      {% for item in site.nav %}
        {% assign active = page.url | slice: 0, item.url.size %}
        <a href="{{ item.url | relative_url }}" {% if active == item.url %}class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
