<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/img/logo/fluxs-header.png' | relative_url }}" alt="{{ site.title }}" width="190" height="40">
      <span class="brand-sub">{{ site.affiliation }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle-label"><span></span></label>
    <nav class="site-nav">
      {% for item in site.nav %}
        {% assign active = page.url | slice: 0, item.url.size %}
        <a href="{{ item.url | relative_url }}" {% if active == item.url %}class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
