<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% if site.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/logo/fluxs-symbol.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/logo/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="180x180" href="{{ '/assets/img/logo/favicon-180.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/logo/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
