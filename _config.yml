# FLUXS – Fluid Experiments at Sapienza
title: FLUXS
full_name: Fluid Experiments at Sapienza
subtitle: Experimental Fluid Dynamics · Sapienza University of Rome
description: >-
  We study real flows with optical and anemometric measurements, both to understand
  fundamental phenomena and for engineering applications.
email: mariotindaro.migliorino@uniroma1.it
affiliation: Sapienza University of Rome
address: |
  Department of Mechanical and Aerospace Engineering (DIMA)
  Via Eudossiana 18
  00184 Rome, Italy

# Site served at the org root: https://flexlab-sapienza.github.io (repo named flexlab-sapienza.github.io)
url: "https://flexlab-sapienza.github.io"
baseurl: ""
# Logo used by search engines and link previews (jekyll-seo-tag).
logo: /assets/img/logo/fluxs-square.png
defaults:
  - scope: { path: "" }
    values:
      image: /assets/img/logo/fluxs-square.png

# Names shown in bold in publication author lists.
highlight_authors:
  - G. P. Romano
  - M. T. Migliorino
  - G. Moscato
  - S. Marcocci
  - M. Sollevanti
  - F. Acquaviva
  - M. Moradi

nav:
  - title: Research
    url: /research/
  - title: Facilities
    url: /facilities/
  - title: Team
    url: /team/
  - title: Teaching
    url: /teaching/
  - title: PhD
    url: /phd/
  - title: Publications
    url: /publications/
  - title: Contact
    url: /contact/

markdown: kramdown
# Preview phase: ask search engines not to index the site. Set to false at launch.
noindex: true
theme: null  # no default GitHub Pages theme; we use our own layouts and CSS
plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
