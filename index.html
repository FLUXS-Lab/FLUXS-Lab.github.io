  <div class="container hero-text">
    <p class="eyebrow">{{ site.full_name }}</p>
    <h1>FLUX<span class="s">S</span></h1>
    <p class="lead">{{ site.description }}</p>
    <p>
      <a class="btn" href="{{ '/research/' | relative_url }}">Our research</a>

  </div>
</section>

<script src="{{ '/assets/js/flow.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
